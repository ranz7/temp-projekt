# Local development only.
services:
  postgres:
    image: postgres:17-alpine
    container_name: projekt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: projekt
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - projekt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  projekt_pgdata:
