[project]
name = "oj-checkers"
version = "1.0.0"
description = "Standalone checker workers for the online judge: a bubblewrap sandbox for Python and an OIOIOI adapter for C++."
requires-python = ">=3.12"
dependencies = ["redis>=5.0"]

[project.optional-dependencies]
# Nothing beyond the standard library is needed to run the unit tests.
dev = []

[project.scripts]
oj-checker-bwrap = "bwrap.__main__:main"
oj-checker-cpp = "cpp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "bwrap", "cpp"]

[tool.ruff]
line-length = 100
target-version = "py312"
