[project]
name = "oj-checkers"
version = "2.0.0"
description = "The online judge checker service: an HTTP service the app asks to judge, judging inside a bubblewrap sandbox."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Nothing beyond the standard library is needed to run the unit tests.
dev = []

[project.scripts]
oj-checker = "common.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "bwrap"]

[tool.ruff]
line-length = 100
target-version = "py312"
