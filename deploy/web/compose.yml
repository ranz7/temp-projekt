# The Next.js app, plus the loop runner that runs from the same image.
#
# Without the loop runner nothing is ever judged: it is the process that syncs
# the machine registry from CHECKER_MACHINES, asks every machine how it is doing,
# hands waiting submissions to machines that can take them, and writes back what
# they answer. The app itself only accepts submissions into the queue.
#
# Production shape on purpose: the image is built or pulled, never a bind mount
# of the git tree, and every setting arrives through an env file.
# `deploy/compose.local.yml` layers development bind mounts on top of this.
#
# Postgres is not declared here. Locally the repository-root `compose.yml`
# provides it; on a real machine it is provisioned separately and DATABASE_URL
# points at it.

services:
  web:
    image: ${WEB_IMAGE:-projekt-web:local}
    build:
      context: ../..
      dockerfile: deploy/web/Dockerfile
    container_name: projekt_web
    restart: unless-stopped
    env_file:
      # Committed safe defaults, so a fresh clone starts with no setup.
      - path: ./.env.example
        required: true
      # Real values and secrets. Gitignored, rendered by a deployment, wins.
      - path: ./.env
        required: false
    ports:
      # Only the host side is configurable; 3000 inside the container is fixed.
      - '${WEB_PORT:-3210}:3000'
    healthcheck:
      # The image's own healthcheck asks whether the process is alive, which is
      # the right question for "restart this container". Here the question is
      # "may traffic rely on it", so it asks readiness.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/api/ready']
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 3

  sweeper:
    image: ${WEB_IMAGE:-projekt-web:local}
    build:
      context: ../..
      dockerfile: deploy/web/Dockerfile
    container_name: projekt_sweeper
    restart: unless-stopped
    # Straight to the loop runner: no migrations, no seed, no HTTP server. The
    # app container owns those, and running them twice at once helps nobody.
    entrypoint: ['node']
    command: ['/app/ops/sweeper.mjs']
    env_file:
      - path: ./.env.example
        required: true
      - path: ./.env
        required: false
    healthcheck:
      # It serves nothing, so the only honest check is that the loop still exists.
      test: ['CMD-SHELL', 'pgrep -f ops/sweeper.mjs > /dev/null || exit 1']
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Node is PID 1 here, so SIGTERM reaches the loop's own handler: it finishes
    # the pass it is in, closes the database connection and exits 0.
    stop_grace_period: 30s
