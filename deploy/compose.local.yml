# Development overrides, kept out of the production-shaped files on purpose.
#
#   docker compose -f compose.yml -f deploy/compose.local.yml up -d
#
# Paths here are relative to the repository root, not to this file: a compose
# file passed with `-f` resolves against the project directory.
#
# What it changes: the checker service and its judge come from the working tree
# instead of the image, so editing either needs a container restart rather than
# a rebuild.

services:
  checker:
    volumes:
      - ./checkers/common:/app/common:ro
      - ./checkers/bwrap:/app/bwrap:ro

  web:
    volumes:
      # Re-seeding picks up a new or edited problem package without a rebuild.
      - ./problems:/app/problems:ro
      # The panel's batch reads the reference solutions from here at run time.
      - ./src/backend/modules/benchmark/solutions:/app/solutions:ro

  sweeper:
    volumes:
      - ./src/backend/modules/benchmark/solutions:/app/solutions:ro
