# One checker machine, locally.
#
# It runs the same image and the same three grants a real checker machine gets
# from Ansible. The real fleet is thirteen machines behind SSH tunnels; here it
# is one container on the compose network, which the app reaches directly
# because there is nothing to tunnel through.
#
# It publishes no host port. The app container reaches it by the service name,
# and nothing else on this laptop can reach it at all.

services:
  checker:
    image: ${CHECKER_IMAGE:-projekt-checker:local}
    build:
      context: ../..
      dockerfile: deploy/checker/Dockerfile.bwrap
    container_name: projekt_checker
    restart: unless-stopped
    env_file:
      - path: ./.env.example
        required: true
      - path: ./.env
        required: false
    # Why each of these is here is written out in deploy/README.md. In short:
    # SYS_ADMIN lets bubblewrap create the namespaces and pivot_root into the
    # sandbox, NET_ADMIN lets it raise loopback inside the network namespace it
    # unshared, and the default seccomp profile blocks pivot_root outright.
    # Nothing here is `privileged: true`, which would also hand over every other
    # capability on the machine.
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    security_opt:
      - seccomp=unconfined
    volumes:
      # The problem packages, read only. No contest data is baked into the image
      # and none travels over HTTP. Only the host side is configurable: the two
      # paths inside the container are what `./.env.example` sets there, and
      # changing one means changing both.
      - ${PROBLEM_PACKAGES_HOST_PATH:-../../problems}:/problems:ro
      # Anonymous, so a job's files never touch the host tree.
      - /scratch
    # Running jobs are given their grace period before the process is killed.
    stop_grace_period: 40s
