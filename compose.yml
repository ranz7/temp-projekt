# The whole local stack in one command:
#
#   docker compose up -d --build
#
# Each deployable keeps its own compose file under `deploy/`, in the shape the
# Ansible templates under `infra/ansible/` render one service at a time. This
# file only pulls those in and adds what a real machine gets from somewhere else:
# the database, and the start-up order around it.
#
# Development bind mounts are deliberately not here. They live in
# `deploy/compose.local.yml`:
#
#   docker compose -f compose.yml -f deploy/compose.local.yml up -d

name: projekt

include:
  - path: deploy/web/compose.yml
  - path: deploy/checker/compose.yml

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: projekt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-projekt}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - projekt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-projekt}']
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10

  # The app applies migrations and seeds the problem packages before it serves,
  # so it must not start until the database answers.
  web:
    depends_on:
      postgres:
        condition: service_healthy

  # The loop runner needs the same database and the schema the app just migrated,
  # so it waits for the app to be ready rather than only for Postgres.
  sweeper:
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_healthy

  # The checker declares no dependency at all: it holds no state, needs neither
  # the database nor the app, answers /health from the moment it starts and
  # judges whatever it is handed. See deploy/checker/compose.yml.

volumes:
  projekt_pgdata:
