---
# Every machine this deployment knows. This file is the single source of truth:
# `CHECKER_MACHINES` for the app and the SSH tunnel list are both rendered from
# the `checkers` group below.
#
# Adding a checker is one line here plus `make deploy` again. Removing one is the
# same line deleted: the app retires the machine and its tunnel disappears.
# `checker_local_port` is the port on the APPLICATION machine where that
# checker's tunnel ends, and every one of them must be different.

all:
  children:
    # The machine Ansible itself runs on. It builds the source archive; nothing
    # is installed on it and nothing here is ever run with sudo.
    control:
      hosts:
        control-node:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"

    fleet:
      children:
        # Postgres, the app, the tunnels and the HTTPS proxy.
        application:
          hosts:
            app-01: {ansible_host: 152.53.64.162, ansible_user: root}

        # One checker service each, reachable only through its SSH tunnel.
        checkers:
          hosts:
            checker-01: {ansible_host: 16.171.242.233, ansible_user: ubuntu, checker_local_port: 9001}
            checker-02: {ansible_host: 134.112.56.50, ansible_user: azureuser, checker_local_port: 9002}
            checker-03: {ansible_host: 20.215.32.66, ansible_user: azureuser, checker_local_port: 9003}
            checker-04: {ansible_host: 13.60.244.229, ansible_user: ubuntu, checker_local_port: 9004}
            checker-05: {ansible_host: 16.171.54.3, ansible_user: ubuntu, checker_local_port: 9005}
            checker-06: {ansible_host: 13.48.13.248, ansible_user: ubuntu, checker_local_port: 9006}
            checker-07: {ansible_host: 16.16.254.81, ansible_user: ubuntu, checker_local_port: 9007}
            checker-08: {ansible_host: 13.49.183.182, ansible_user: ubuntu, checker_local_port: 9008}
            checker-09: {ansible_host: 16.16.162.8, ansible_user: ubuntu, checker_local_port: 9009}
            checker-10: {ansible_host: 13.48.30.213, ansible_user: ubuntu, checker_local_port: 9010}
            checker-11: {ansible_host: 56.228.30.235, ansible_user: ubuntu, checker_local_port: 9011}
            checker-12: {ansible_host: 16.171.149.111, ansible_user: ubuntu, checker_local_port: 9012}
            checker-13: {ansible_host: 13.60.21.67, ansible_user: ubuntu, checker_local_port: 9013}
