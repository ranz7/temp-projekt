---
# Capability: ensure-app-ssh-key
# Problem: the application machine opens an SSH tunnel to every checker, and it
# must do that with an identity of its own.
#
# The keypair is made on the application machine on the first run and never
# leaves it: the private half is read by nothing but the tunnel container, and
# only the public half is read back here, to be installed on the checkers. The
# operator's personal key is never copied to a server.

- name: Ensure the key directory
  ansible.builtin.file:
    path: "{{ oj_ssh_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Generate the application machine's own keypair
  ansible.builtin.command:
    cmd: ssh-keygen -t ed25519 -N '' -C online-judge-app -f {{ oj_app_key_path }}
    creates: "{{ oj_app_key_path }}"

- name: Keep the private key readable by root alone
  ansible.builtin.file:
    path: "{{ oj_app_key_path }}"
    owner: root
    group: root
    mode: "0600"

- name: Read the public key back
  ansible.builtin.slurp:
    src: "{{ oj_app_key_path }}.pub"
  register: oj_app_public_key_raw

- name: Remember the public key for the checker machines
  ansible.builtin.set_fact:
    oj_app_public_key: "{{ oj_app_public_key_raw.content | b64decode | trim }}"

- name: Refuse a public key that is not an ed25519 one
  ansible.builtin.assert:
    that:
      - oj_app_public_key is match('^ssh-ed25519 ')
    fail_msg: >-
      {{ oj_app_key_path }}.pub on the application machine is not an ed25519
      public key. Remove the pair under {{ oj_ssh_dir }} and run again.
