---
# Capability: install-docker
# Problem: everything this deployment runs is a container, on machines that
# arrive with nothing. Docker's own apt repository, so the Engine and the Compose
# plugin are recent enough for the compose files rendered here.

- name: Map the CPU architecture to Docker's apt architecture
  ansible.builtin.set_fact:
    oj_docker_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts.architecture] }}"

- name: Install the packages the deployment itself needs
  ansible.builtin.apt:
    name:
      - ca-certificates
      - openssh-client
      - python3-debian
      - tar
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add Docker's apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}"
    suites: ["{{ ansible_facts.distribution_release }}"]
    components: [stable]
    architectures: "{{ oj_docker_arch }}"
    signed_by: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg"
    state: present

- name: Install Docker Engine and the Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Start Docker now and after every reboot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
