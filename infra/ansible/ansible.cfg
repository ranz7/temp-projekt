[defaults]
inventory = hosts.yml
roles_path = capabilities
interpreter_python = auto_silent
host_key_checking = True
retry_files_enabled = False
deprecation_warnings = True
# Thirteen checkers plus the application machine converge in one wave.
forks = 15
timeout = 30

[ssh_connection]
# accept-new learns a host key on first contact and pins it afterwards, so a
# fresh machine needs no manual ssh-keyscan and a CHANGED key still stops the run.
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=120s
pipelining = True

[privilege_escalation]
become = True
become_method = sudo
